<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital contact card | N3XRA</title>
  <meta name="description" content="A digital contact card hosted by N3XRA.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/card/card.css?v=12">
</head>
<body class="contact-card-page">
  <main class="contact-card-shell" id="card-shell" aria-live="polite">
    <section class="contact-card-loading" id="card-loading">
      <span class="contact-card-mark" aria-hidden="true">N3</span>
      <p>Opening contact card…</p>
    </section>

    <article class="contact-card" id="contact-card" hidden>
      <header class="contact-card-hero">
        <img class="contact-card-background" id="card-background" alt="" hidden>
        <div class="contact-card-hero-shade" aria-hidden="true"></div>
        <img class="contact-card-company-logo" id="card-logo" alt="" hidden>
        <div class="contact-card-avatar" id="card-avatar" aria-hidden="true"><img id="card-profile-image" alt="" hidden><span id="card-initials"></span></div>
        <p class="contact-card-eyebrow" id="card-company"></p>
        <h1 id="card-name"></h1>
        <p class="contact-card-headline" id="card-headline"></p>
        <p class="contact-card-location" id="card-location"></p>
        <div class="contact-card-primary-actions" id="card-primary-actions"></div>
        <button class="contact-card-connect-button" id="card-connect-button" type="button" hidden>Connect back</button>
      </header>

      <div class="contact-card-body" id="card-sections">
        <section class="contact-card-about" id="card-about-section" data-card-section="about" hidden>
          <p class="contact-card-section-label">About</p>
          <p id="card-bio"></p>
        </section>

        <section class="contact-card-links" id="card-contact-section" data-card-section="contact" aria-labelledby="card-contact-title" hidden>
          <div class="contact-card-section-head">
            <p class="contact-card-section-label" id="card-contact-title">Contact</p>
            <span>Tap to open</span>
          </div>
          <div class="contact-card-link-list" id="card-contact-links"></div>
        </section>

        <section class="contact-card-links" id="card-custom-links-section" data-card-section="links" aria-labelledby="card-links-title" hidden>
          <div class="contact-card-section-head">
            <p class="contact-card-section-label" id="card-links-title">Links</p>
            <span>Explore</span>
          </div>
          <div class="contact-card-link-list" id="card-links"></div>
        </section>
      </div>

      <footer class="contact-card-footer" id="card-branding-footer">
        <a href="/contact-card/" aria-label="Learn about N3XRA Contact Card"><span>Powered by</span><strong>N3XRA</strong></a>
      </footer>
    </article>

    <section class="contact-card-error" id="card-error" hidden>
      <span class="contact-card-mark" aria-hidden="true">N3</span>
      <h1>Card unavailable</h1>
      <p id="card-error-message">This digital card is not published right now.</p>
      <a href="https://www.n3xra.com">Visit N3XRA</a>
    </section>
  </main>
  <dialog class="contact-card-connect-dialog" id="card-connect-dialog">
    <form class="contact-card-connect-form" id="card-connect-form">
      <header><div><p class="contact-card-section-label">Connect back</p><h2 id="card-connect-title">Share your details</h2><p id="card-connect-intro"></p></div><button type="button" id="card-connect-close" aria-label="Close">×</button></header>
      <div class="contact-card-connect-fields" id="card-connect-fields">
        <label><span>Name</span><input name="name" maxlength="180" autocomplete="name" required></label>
        <label><span>Email</span><input name="email" type="email" maxlength="320" autocomplete="email"></label>
        <label><span>Phone</span><input name="phone" type="tel" maxlength="40" autocomplete="tel"></label>
        <label><span>Company <small>Optional</small></span><input name="company" maxlength="220" autocomplete="organization"></label>
        <label><span>Note <small>Optional</small></span><textarea name="message" maxlength="800" rows="3" placeholder="Where did you meet?"></textarea></label>
        <label class="contact-card-honeypot" aria-hidden="true"><span>Website</span><input name="website" tabindex="-1" autocomplete="off"></label>
        <p class="contact-card-connect-disclosure" id="card-connect-disclosure"></p>
        <p class="contact-card-connect-status" id="card-connect-status" role="status"></p>
      </div>
      <div class="contact-card-connect-success" id="card-connect-success" hidden><span aria-hidden="true">✓</span><h3>Details shared</h3><p>Your information is now in this person’s N3XRA Contacts.</p></div>
      <footer><button type="button" class="is-secondary" id="card-connect-cancel">Cancel</button><button type="submit" id="card-connect-submit">Share my details</button></footer>
    </form>
  </dialog>
  <script type="module" src="/card/public-card.js?v=4"></script>
</body>
</html>
