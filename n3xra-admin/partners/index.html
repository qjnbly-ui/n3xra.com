<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA | Partner Applications</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css?v=3">
  <link rel="stylesheet" href="/client-portal/portal.css?v=17">
  <link rel="stylesheet" href="/n3xra-admin/partners/partners-admin.css?v=4">
  <script src="/shared/config.js"></script>
  <script src="/account/admin/admin-shell.js?v=2" defer></script><script src="/assets/site-nav.js?v=3" defer></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/account/admin/admin.css?v=26">
  <script type="module" src="/account/admin/product-shell.js?v=12"></script>
</head>
<body class="portal-loading">

  <main class="portal-shell">
    <section class="portal-heading">
      <div><p class="portal-kicker">Master administration</p><h1>Partner Applications</h1></div>
    </section>

    <div class="portal-layout">
      <nav class="portal-nav" aria-label="N3XRA administration"></nav>

      <section class="portal-workspace partner-admin-workspace" aria-labelledby="partner-admin-title">
        <div class="portal-workspace-head">
          <div>
            <p class="portal-kicker">Partner pipeline</p>
            <h2 id="partner-admin-title">Review applications</h2>
            <p>Review program interests, update decisions, and keep private notes.</p>
          </div>
          <button class="portal-button portal-button-secondary" id="partner-refresh" type="button">Refresh</button>
        </div>

        <div class="partner-admin-stats" id="partner-stats" aria-label="Application totals"></div>

        <div class="partner-admin-filters">
          <label>Search<input id="partner-search" type="search" placeholder="Name, email, organization"></label>
          <label>Program<select id="partner-program-filter"><option value="">All programs</option><option value="website">Website referrals</option><option value="software">Software commissions</option><option value="future">Future opportunities</option></select></label>
          <label>Status<select id="partner-status-filter"><option value="">All active statuses</option><option value="submitted">Submitted</option><option value="reviewing">Reviewing</option><option value="approved">Approved</option><option value="waitlisted">Waitlisted</option><option value="rejected">Rejected</option></select></label>
        </div>

        <div class="partner-admin-list" id="partner-application-list"></div>
      </section>
    </div>
  </main>

  <div class="portal-status" id="portal-status" role="status">Opening partner applications…</div>
  <dialog class="partner-delete-dialog" id="partner-delete-dialog" aria-labelledby="partner-delete-title" aria-describedby="partner-delete-message">
    <div class="partner-delete-card">
      <p class="portal-kicker">Permanent action</p>
      <h2 id="partner-delete-title">Delete this application?</h2>
      <p id="partner-delete-message"></p>
      <div class="partner-delete-impact" id="partner-delete-impact" hidden>
        <strong>This partner has already been used.</strong>
        <p id="partner-delete-impact-summary"></p>
        <label><input id="partner-delete-acknowledge" type="checkbox"> <span>I understand that partner activity and financial history will be permanently removed, and linked accounts or website requests will lose their partner attribution.</span></label>
      </div>
      <div class="partner-delete-actions">
        <button class="portal-button portal-button-secondary" id="partner-delete-cancel" type="button">Keep application</button>
        <button class="portal-button portal-button-danger" id="partner-delete-confirm" type="button">Delete permanently</button>
      </div>
    </div>
  </dialog>
  <script type="module" src="/client-portal/portal-shell.js"></script>
  <script type="module" src="/n3xra-admin/partners/partners-admin.js?v=4"></script>
</body>
</html>
