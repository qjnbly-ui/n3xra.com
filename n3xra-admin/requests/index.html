<body class="portal-loading">
  <main class="portal-shell">
    <section class="portal-heading"><div><p class="portal-kicker">Master administration</p><h1>Website Requests</h1></div></section>
    <div class="portal-layout">
      <nav class="portal-nav" aria-label="Website administration"></nav>
      <section class="portal-workspace">
        <div class="portal-workspace-head"><div><p class="portal-kicker">Intake desk</p><h2>Request processing</h2><p>Review the request, accept the work, then open onboarding before preparing the Proposal &amp; Agreement.</p></div></div>
        <section class="website-request-command" aria-labelledby="request-queue-title">
          <div class="website-request-workspace">
            <aside class="website-request-selection" aria-label="Submitted request selection">
              <header class="website-request-command-head">
                <div><p class="portal-kicker">Submitted requests</p><h2 id="request-queue-title">Intake queue</h2><p id="admin-request-summary">Loading requests…</p></div>
                <div class="website-request-counts" id="admin-request-counts" aria-label="Request counts"></div>
              </header>
              <div class="website-request-filters" id="admin-request-filters" aria-label="Filter requests">
                <button class="is-current" type="button" data-request-filter="open">Needs action</button>
                <button type="button" data-request-filter="all">All active</button>
              </div>
              <div class="website-request-queue" id="admin-request-list" aria-label="Submitted requests"></div>
            </aside>
            <section class="website-request-detail" id="admin-request-detail" aria-live="polite"></section>
          </div>
        </section>
      </section>
    </div>
  </main>
  <div class="portal-status" id="portal-status" role="status">Opening website requests…</div>
