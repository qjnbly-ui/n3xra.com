<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA | Support Requests</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css?v=4">
  <link rel="stylesheet" href="/client-portal/portal.css?v=17">
  <link rel="stylesheet" href="/account/admin/admin.css?v=34">
  <script src="/shared/config.js"></script>
  <script src="/account/admin/admin-shell.js?v=2" defer></script><script src="/assets/site-nav.js?v=5"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="support-admin-page" data-admin-view="support">

  <main class="portal-shell account-admin-page">
    <section class="portal-workspace hidden" id="setup-panel">
      <div class="portal-workspace-head"><div><h2>Connect Supabase</h2><p>Add the browser project configuration to continue.</p></div></div>
    </section>

    <div class="portal-layout hidden" id="admin-panel">
      <nav class="portal-nav"></nav>
      <section class="portal-workspace support-directory-app">
        <div class="support-workbench">
          <aside class="support-queue-pane">
            <div class="support-queue-head"><div><p class="portal-kicker">Request queue</p><strong>Support &amp; client work</strong></div><span id="support-count"></span></div>
            <button class="portal-button support-new-work-button" id="support-new-work" type="button">Start client work</button>
            <label class="account-admin-field"><span>Find a request</span><input id="support-search" type="search" placeholder="Subject, person, email" autocomplete="off"></label>
            <div class="support-filter-grid">
              <label class="account-admin-field"><span>Status</span><select id="support-filter"><option value="open">Open requests</option><option value="new">New</option><option value="in_progress">In progress</option><option value="waiting">Waiting</option><option value="resolved">Resolved</option><option value="closed">Closed</option><option value="all">All requests</option></select></label>
              <label class="account-admin-field"><span>Priority</span><select id="support-priority-filter"><option value="all">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></label>
            </div>
            <div class="support-queue-summary" id="support-summary"></div>
            <select class="support-hidden-select" id="support-select" aria-hidden="true" tabindex="-1"></select>
            <div class="support-request-list" id="support-list"></div>
          </aside>
          <section class="support-detail-pane"><div id="support-detail"></div></section>
        </div>
        <p class="admin-status" id="admin-status" role="status"></p>
      </section>
    </div>
  </main>
  <dialog class="platform-admin-invite-dialog support-work-dialog" id="support-work-dialog" aria-labelledby="support-work-title">
    <div class="platform-admin-dialog-head"><div><p class="portal-kicker">N3XRA-initiated work</p><h2 id="support-work-title">Start work for a client</h2></div><button class="platform-admin-dialog-close" id="support-work-close" type="button" aria-label="Close">×</button></div>
    <p class="platform-admin-dialog-copy">Create work the client can follow even when they did not submit the original request.</p>
    <form class="platform-admin-invite-form" id="support-work-form">
      <label class="account-admin-field"><span>Client account</span><select id="support-work-account" required></select></label>
      <label class="account-admin-field"><span>Related area</span><select id="support-work-context" disabled><option value="">Choose a client account first</option></select></label>
      <label class="account-admin-field"><span>Type</span><select id="support-work-topic"><option value="general-support">General support</option><option value="account-access">Account or access</option><option value="billing">Billing</option><option value="communications">Communications</option><option value="records">Records</option><option value="website-change">Website</option><option value="analytics">Analytics</option><option value="new-feature">New feature or idea</option><option value="technical-support">Technical support</option><option value="other">Other</option></select></label>
      <label class="account-admin-field"><span>Title</span><input id="support-work-subject" maxlength="140" required placeholder="Configure site analytics"></label>
      <label class="account-admin-field"><span>Work description</span><textarea id="support-work-message" rows="4" maxlength="4000" required></textarea></label>
      <div class="support-control-grid"><label class="account-admin-field"><span>Estimated start</span><input id="support-work-start" type="datetime-local"></label><label class="account-admin-field"><span>Estimated completion</span><input id="support-work-completion" type="datetime-local"></label></div>
      <label class="account-admin-field"><span>First client-visible update</span><textarea id="support-work-note" rows="3" maxlength="8000" placeholder="Optional note the client will see"></textarea></label>
      <div class="platform-admin-dialog-actions"><button class="portal-button portal-button-secondary" id="support-work-cancel" type="button">Cancel</button><button class="portal-button" type="submit">Create visible work</button></div>
      <p class="platform-admin-modal-status" id="support-work-status" role="status"></p>
    </form>
  </dialog>
  <script type="module" src="/account/admin/admin.js?v=50"></script>
</body>
</html>
