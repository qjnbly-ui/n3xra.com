<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA | Admin Inbox</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css?v=4">
  <link rel="stylesheet" href="/client-portal/portal.css?v=17">
  <link rel="stylesheet" href="/account/admin/admin.css?v=33">
  <link rel="stylesheet" href="/account/admin/inbox/inbox.css?v=4">
  <script src="/shared/config.js"></script>
  <script src="/account/admin/admin-shell.js?v=2" defer></script><script src="/assets/site-nav.js?v=5"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="portal-loading admin-inbox-page" data-admin-view="inbox">
  <main class="portal-shell account-admin-page notification-shell">
    <div class="portal-layout">
      <nav class="portal-nav" aria-label="N3XRA administration"></nav>
      <section class="portal-workspace notification-inbox-app">
        <header class="notification-pagebar">
          <div><p class="portal-kicker">N3XRA administration</p><h1>Admin inbox</h1><p>Account, security, billing, support, and product activity that needs attention.</p></div>
          <div class="notification-heading-actions"><button class="notification-settings-button" id="open-notification-settings" type="button">Notification settings</button><button class="portal-button portal-button-secondary" id="mark-all-read" type="button">Mark all read</button><button class="portal-button portal-button-secondary" id="refresh-inbox" type="button">Refresh</button></div>
        </header>
        <div class="notification-inbox-scroll">
          <section class="notification-toolbar" aria-label="Notification filters">
            <div class="notification-tabs" role="tablist">
              <button class="is-active" data-folder="inbox" type="button">Inbox <span id="inbox-count"></span></button>
              <button data-folder="archive" type="button">Archive</button>
              <button data-folder="trash" type="button">Trash</button>
            </div>
            <label>Search<input id="notification-search" type="search" placeholder="Name, email, project, or message"></label>
            <label>Product<select id="notification-product"><option value="">All products</option><option value="platform">Platform</option><option value="accounts">Accounts</option><option value="support">Support</option><option value="websites">Websites</option><option value="partners">Partners</option><option value="records">Records</option><option value="billing">Billing</option><option value="system">System</option></select></label>
            <label>Priority<select id="notification-priority"><option value="">All priorities</option><option value="important">Important</option><option value="activity">Activity</option><option value="system">System</option></select></label>
            <label>Status<select id="notification-read"><option value="">Read and unread</option><option value="unread">Unread</option><option value="read">Read</option></select></label>
          </section>
          <section class="notification-list" id="notification-list" aria-live="polite"></section>
          <p class="admin-inbox-status" id="admin-inbox-status" role="status">Loading notifications…</p>
        </div>
      </section>
    </div>
  </main>
  <dialog class="notification-dialog" id="notification-dialog">
    <article>
      <button class="notification-dialog-close" id="close-notification" type="button" aria-label="Close">×</button>
      <p class="portal-kicker" id="notification-detail-product"></p>
      <h2 id="notification-detail-title"></h2>
      <p class="notification-detail-meta" id="notification-detail-meta"></p>
      <div class="notification-detail-message" id="notification-detail-message"></div>
      <div class="notification-detail-record" id="notification-detail-record"></div>
      <div class="notification-detail-actions" id="notification-detail-actions"></div>
    </article>
  </dialog>
  <dialog class="notification-dialog notification-settings-dialog" id="notification-settings-dialog">
    <article>
      <button class="notification-dialog-close" id="close-notification-settings" type="button" aria-label="Close">×</button>
      <p class="portal-kicker">Delivery preferences</p>
      <h2>Notification settings</h2>
      <p class="notification-settings-copy">Admin Inbox notifications always remain here. Choose whether copies are also sent directly to you.</p>
      <form id="notification-settings-form">
        <label class="notification-setting-option" for="notification-email-enabled">
          <span><strong>Email notifications</strong><small>Send each new Admin Inbox notification by email.</small></span>
          <input id="notification-email-enabled" type="checkbox" role="switch">
        </label>
        <label class="notification-setting-option" for="notification-sms-enabled">
          <span><strong>Text notifications</strong><small>Send each new notification to the private admin phone ending in 6772.</small></span>
          <input id="notification-sms-enabled" type="checkbox" role="switch">
        </label>
        <p class="notification-settings-status" id="notification-settings-status" role="status"></p>
        <div class="notification-settings-actions">
          <button class="portal-button portal-button-secondary" id="cancel-notification-settings" type="button">Cancel</button>
          <button class="portal-button" id="save-notification-settings" type="submit">Save settings</button>
        </div>
      </form>
    </article>
  </dialog>
  <script type="module" src="/account/admin/inbox/inbox.js?v=8"></script>
</body>
</html>
