<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA | Internal Files</title><meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css?v=4"><link rel="stylesheet" href="/client-portal/portal.css?v=17"><link rel="stylesheet" href="/account/admin/admin.css?v=27"><link rel="stylesheet" href="/account/admin/files/files.css?v=12">
  <script src="/shared/config.js"></script><script src="/account/admin/admin-shell.js?v=2" defer></script><script src="/assets/site-nav.js?v=5"></script>
</head>
<body data-admin-view="files">
  <main class="portal-shell account-admin-page">
    <section class="portal-workspace hidden" id="setup-panel"><div class="portal-workspace-head"><div><h2>Connect Supabase</h2><p>Add the browser project configuration to continue.</p></div></div></section>
    <div class="portal-layout hidden" id="admin-panel">
      <nav class="portal-nav"></nav>
      <section class="portal-workspace n3xra-files-workspace">
        <section class="n3xra-files-shell">
          <aside class="n3xra-files-locations">
            <div class="n3xra-files-location-list">
              <p class="n3xra-files-section-label">Folders</p>
              <div class="n3xra-folder-tree" id="n3xra-folder-tree"></div>
            </div>
          </aside>
          <section class="n3xra-file-view" id="n3xra-file-view">
            <div class="n3xra-file-browser">
              <div class="n3xra-file-browser-head">
                <div class="n3xra-files-breadcrumb" aria-label="Current folder"><button class="n3xra-breadcrumb-button is-current" type="button" data-folder-path="">Files</button></div>
                <div class="n3xra-files-actions"><label class="portal-button" for="n3xra-file-input">Upload files</label><input id="n3xra-file-input" type="file" multiple hidden><button class="portal-button portal-button-secondary" id="n3xra-folder-button" type="button">Upload folder</button><input id="n3xra-folder-input" type="file" webkitdirectory directory multiple hidden></div>
              </div>
              <label class="n3xra-file-search"><span>Search files</span><input id="n3xra-file-search" type="search" placeholder="Search this folder"></label>
              <div class="n3xra-file-selection-toolbar" id="n3xra-file-selection-toolbar" hidden><p id="n3xra-file-selection-status" role="status"></p><div><button class="portal-button portal-button-secondary" id="n3xra-clear-selection" type="button" hidden>Clear selection</button><button class="portal-button portal-button-secondary" id="n3xra-download-selected" type="button">Download selected</button><button class="portal-button portal-button-secondary" id="n3xra-approve-selected" type="button" hidden>Approve pending</button><button class="portal-button portal-button-secondary" id="n3xra-reject-selected" type="button" hidden>Reject pending</button><button class="portal-button" id="n3xra-publish-selected" type="button" hidden>Publish to CDN</button><button class="portal-button portal-button-secondary" id="n3xra-copy-selected-links" type="button" hidden>Copy published links</button><button class="portal-button portal-button-secondary" id="n3xra-refresh-selected-cdn" type="button" hidden>Refresh CDN files</button><button class="portal-button n3xra-danger-button" id="n3xra-delete-selected" type="button">Delete selected</button></div></div>
              <div class="n3xra-file-list" id="n3xra-file-list"><div class="n3xra-empty">Loading files…</div></div>
              <p class="admin-status" id="admin-status" role="status"></p>
            </div>
          </section>
        </section>
      </section>
    </div>
    <div class="n3xra-modal" id="file-confirm-modal" hidden><div class="n3xra-modal-scrim" data-modal-cancel></div><section class="n3xra-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="file-confirm-title"><p class="portal-kicker">Internal Files</p><h2 id="file-confirm-title">Delete file?</h2><p id="file-confirm-copy">This file will be permanently removed.</p><div class="n3xra-modal-actions"><button class="portal-button portal-button-secondary" type="button" data-modal-cancel>Cancel</button><button class="portal-button n3xra-danger-button" id="file-confirm-delete" type="button">Delete file</button></div></section></div>
    <div class="n3xra-modal" id="file-preview-modal" hidden><div class="n3xra-modal-scrim" data-preview-close></div><section class="n3xra-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="file-preview-title"><div class="n3xra-preview-head"><div><p class="portal-kicker">Internal Files</p><h2 id="file-preview-title">Preview</h2></div><button class="n3xra-preview-close" type="button" data-preview-close aria-label="Close preview">×</button></div><div class="n3xra-preview-body" id="file-preview-body"></div><div class="n3xra-modal-actions"><button class="portal-button portal-button-secondary" type="button" data-preview-close>Close</button><a class="portal-button" id="file-preview-download" href="#" target="_blank" rel="noreferrer" download>Download</a></div></section></div>
  </main>
  <script type="module" src="/account/admin/admin.js?v=36"></script>
</body>
</html>
