<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>N3XRA | Career Applications</title>
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css"><link rel="stylesheet" href="/client-portal/portal.css?v=16"><link rel="stylesheet" href="/account/admin/admin.css?v=26"><link rel="stylesheet" href="/account/admin/applications/applications.css?v=3">
  <script src="/shared/config.js"></script><script src="/account/admin/admin-shell.js?v=1" defer></script><script src="/assets/site-nav.js" defer></script>
</head>
<body class="applications-admin-page account-admin-page" data-admin-view="applications">
  <main class="portal-shell account-admin-page applications-shell"><div class="portal-layout"><nav class="portal-nav" aria-label="N3XRA administration"></nav><section class="portal-workspace applications-directory-app">
    <header class="applications-pagebar"><div><p class="portal-kicker">Company</p><h1>Career Applications</h1><p id="application-summary">Loading applications…</p></div><button class="portal-button" id="add-application" type="button">Add applicant</button></header>
    <section class="application-workspace">
      <aside class="application-queue-pane"><header class="application-queue-head"><div><p class="portal-kicker">Applicant queue</p><strong>Career submissions</strong></div></header><div class="filters" id="application-filters"><button data-filter="active" class="selected">Active</button><button data-filter="all">All</button><button data-filter="talent_pool">Talent pool</button></div><div id="application-list" class="application-list"></div></aside>
      <section id="application-detail" class="application-detail"><div class="application-empty-detail"><p class="portal-kicker">Applicant profile</p><h2>Select an application</h2><p>Choose an applicant to review their account, files, source conversation, and private notes.</p></div></section>
    </section>
  </section></div>
  <dialog id="application-dialog"><form id="manual-application-form" method="dialog"><header><div><p>Manual intake</p><h2>Add an applicant</h2></div><button value="cancel" aria-label="Close">×</button></header><div class="dialog-grid"><label>Name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Primary direction<select name="role_interest"><option value="open_to_best_fit">Open to the best fit</option><option value="software_product">Software and product development</option><option value="websites_portals">Website development and portals</option><option value="design_brand">Product design and brand</option><option value="ai_automation">AI and automation</option><option value="business_development">Business development</option><option value="sales">Sales</option><option value="marketing_communications">Marketing and communications</option><option value="content_social">Content and social media</option><option value="partnerships">Partnerships and referrals</option><option value="client_success">Client success</option><option value="operations">Operations and administration</option><option value="project_delivery">Project and delivery management</option><option value="support">Customer and technical support</option><option value="finance">Finance and bookkeeping</option><option value="leadership_strategy">Leadership and strategy</option><option value="research">Research and analysis</option><option value="internship_learning">Internship or apprenticeship</option><option value="advisor">External advisor</option><option value="investor">Investor</option><option value="other">A role not listed</option></select></label><label>Proposed title<input name="proposed_title" maxlength="160" placeholder="Optional"></label><label>Source link<input name="source_url" type="url" placeholder="Conversation or referral URL"></label><label class="wide">Initial message / context<textarea name="message" rows="7" required placeholder="Paste their message or your notes from the conversation."></textarea></label></div><footer><button value="cancel" type="button" id="cancel-dialog">Cancel</button><button value="default" type="submit">Save applicant</button></footer></form></dialog>
  </main>
  <script type="module" src="/account/admin/applications/applications.js?v=5"></script>
</body>
</html>
