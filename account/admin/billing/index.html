<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA | Billing &amp; Plans</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" href="/assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site-nav.css?v=4">
  <link rel="stylesheet" href="/client-portal/portal.css?v=17">
  <link rel="stylesheet" href="/account/admin/admin.css?v=28">
  <script src="/shared/config.js"></script>
  <script src="/account/admin/admin-shell.js?v=2" defer></script><script src="/assets/site-nav.js?v=5"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="billing-admin-page" data-admin-view="billing">

  <main class="portal-shell account-admin-page">
    <section class="portal-workspace hidden" id="setup-panel">
      <div class="portal-workspace-head"><div><h2>Connect Supabase</h2><p>Add the browser project configuration to continue.</p></div></div>
    </section>

    <div class="portal-layout hidden" id="admin-panel">
      <nav class="portal-nav"></nav>
      <section class="portal-workspace billing-directory-app">
        <div class="billing-workbench">
          <aside class="billing-roster-pane">
            <div class="billing-roster-head">
              <div><p class="portal-kicker">Billing accounts</p><strong>Subscriptions</strong></div>
              <span id="billing-count"></span>
            </div>
            <label class="account-admin-field"><span>Find billing</span><input id="billing-filter" type="search" placeholder="Account, email, plan" autocomplete="off"></label>
            <div class="billing-filter-grid">
              <label class="account-admin-field"><span>Product</span><select id="billing-product"><option value="all">All products</option><option value="records">Records</option></select></label>
              <label class="account-admin-field"><span>Health</span><select id="billing-health"><option value="all">All states</option><option value="active">Active</option><option value="trialing">Trialing</option><option value="attention">Needs attention</option><option value="internal">Internal only</option><option value="disconnected">No Stripe record</option></select></label>
            </div>
            <div class="billing-roster-summary" id="billing-summary"></div>
            <div class="billing-list" id="billing-list"></div>
          </aside>
          <section class="billing-detail-pane"><div id="billing-detail"></div></section>
        </div>
        <p class="admin-status" id="admin-status" role="status"></p>
      </section>
    </div>
  </main>
  <script type="module" src="/account/admin/admin.js?v=40"></script>
</body>
</html>
