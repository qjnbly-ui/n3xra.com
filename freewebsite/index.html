<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Website Offer | N3XRA</title>
  <meta
    name="description"
    content="Limited Founding Offer: free website build cost. Hosting starts at $25 per month with a one-year minimum, and annual commitments save 10%."
  >
  <link rel="canonical" href="https://www.n3xra.com/freewebsite" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Free Website Offer | N3XRA" />
  <meta
    property="og:description"
    content="Limited Founding Offer: free website build cost. Hosting starts at $25 per month with a one-year minimum, and annual commitments save 10%."
  />
  <meta property="og:url" content="https://www.n3xra.com/freewebsite" />
  <meta property="og:image" content="https://www.n3xra.com/assets/N3xra-Add-Free-Website.png" />
  <meta property="og:image:secure_url" content="https://www.n3xra.com/assets/N3xra-Add-Free-Website.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="N3XRA Limited Founding Offer for a free website build" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Free Website Offer | N3XRA" />
  <meta
    name="twitter:description"
    content="Limited Founding Offer: free website build cost. Hosting starts at $25 per month with a one-year minimum, and annual commitments save 10%."
  />
  <meta name="twitter:image" content="https://www.n3xra.com/assets/N3xra-Add-Free-Website.png" />
  <link rel="icon" type="image/png" sizes="284x284" href="/assets/n3xra_logo_transparent_small.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050a12;
    }

    @view-transition {
      navigation: auto;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(50rem 32rem at 15% 15%, rgba(22, 185, 237, 0.2), transparent 64%),
        radial-gradient(46rem 30rem at 88% 78%, rgba(52, 91, 226, 0.16), transparent 66%),
        #050a12;
    }

    .offer-intro {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
    }

    .offer-stage {
      position: absolute;
      display: grid;
      width: min(100% - 2rem, 1080px);
      place-items: center;
      text-align: center;
    }

    .offer-brand {
      position: relative;
      z-index: 2;
      width: clamp(220px, 30vw, 400px);
      height: clamp(100px, 11vw, 132px);
      opacity: 0;
      animation: brandArrive 800ms 3.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .offer-brand img {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%);
      view-transition-name: offer-brand-logo;
    }

    .offer-brand::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      aspect-ratio: 916 / 549;
      background: linear-gradient(
        110deg,
        transparent 28%,
        rgba(255, 255, 255, 0.72) 48%,
        transparent 68%
      );
      background-position: 180% 0;
      background-size: 260% 100%;
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      -webkit-mask: url("/assets/n3xra_logo_transparent.png") center / contain no-repeat;
      mask: url("/assets/n3xra_logo_transparent.png") center / contain no-repeat;
      animation: logoShimmer 5.2s ease-in-out infinite;
    }

    .offer-image-stage {
      animation: imageStage 3.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .offer-image {
      display: block;
      width: min(100%, 900px);
      height: auto;
      border: 1px solid rgba(168, 239, 255, 0.22);
      border-radius: clamp(14px, 2vw, 24px);
      box-shadow: 0 40px 110px rgba(0, 0, 0, 0.52);
    }

    .offer-copy-stage {
      grid-template-rows: max-content minmax(170px, 220px);
      align-content: center;
      gap: 0.35rem;
      max-width: 850px;
      min-height: min(510px, 72vh);
      padding: 1.5rem;
    }

    .offer-message-stack {
      display: grid;
      width: 100%;
      min-height: clamp(170px, 22vh, 220px);
      place-items: center;
    }

    .offer-eyebrow {
      margin: 0 0 1rem;
      color: #a8efff;
      font-size: clamp(0.7rem, 1.5vw, 0.86rem);
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .offer-message {
      display: grid;
      width: 100%;
      max-width: 850px;
      margin: 0;
      grid-area: 1 / 1;
      place-items: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: clamp(1.65rem, 4.2vw, 3.7rem);
      font-weight: 650;
      line-height: 1.15;
      opacity: 0;
      text-align: center;
      text-wrap: balance;
      transform: translateY(22px);
      animation: messageStage 2.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .offer-message:nth-child(1) {
      animation-delay: 3.75s;
    }

    .offer-message:nth-child(2) {
      animation-delay: 6.05s;
    }

    .offer-message:nth-child(3) {
      animation-delay: 8.35s;
    }

    .offer-message:nth-child(4) {
      animation-delay: 10.65s;
    }

    .offer-message:nth-child(5) {
      animation-delay: 12.95s;
      animation-name: finalMessageStage;
      animation-duration: 3.15s;
    }

    .offer-message h1 {
      max-width: 820px;
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 7vw, 6.3rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.92;
      text-wrap: balance;
    }

    .offer-message-final {
      color: #ffffff;
      font-weight: 750;
    }

    .offer-message-final strong {
      display: inline-block;
      margin-left: 0.24em;
      color: #a8efff;
      view-transition-name: start-project-cta;
    }

    ::view-transition-group(start-project-cta) {
      z-index: 20;
      animation-duration: 950ms;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    ::view-transition-group(offer-brand-logo) {
      z-index: 19;
      animation-duration: 950ms;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    .offer-progress {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      left: 1.25rem;
      height: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
    }

    .offer-progress::after {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #17bbed, #a8efff);
      content: "";
      transform: scaleX(0);
      transform-origin: left;
      animation: progress 16.1s linear forwards;
    }

    .offer-skip {
      position: fixed;
      z-index: 4;
      top: 1.25rem;
      right: 1.25rem;
      padding: 0.68rem 0.9rem;
      color: rgba(255, 255, 255, 0.76);
      background: rgba(8, 17, 29, 0.72);
      border: 1px solid rgba(168, 239, 255, 0.24);
      border-radius: 999px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 750;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .offer-skip:hover,
    .offer-skip:focus-visible {
      color: #ffffff;
      border-color: #a8efff;
      transform: translateY(-1px);
    }

    @keyframes imageStage {
      0% {
        opacity: 0;
        transform: scale(0.94);
        filter: blur(12px);
      }
      20%,
      68% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(8px);
        visibility: hidden;
      }
    }

    @keyframes messageStage {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      18%,
      74% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-18px);
      }
    }

    @keyframes finalMessageStage {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(1.04);
      }
      18%,
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes brandArrive {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      to {
        opacity: 0.9;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes progress {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes logoShimmer {
      0%,
      62% {
        background-position: 180% 0;
        opacity: 0;
      }
      70% {
        opacity: 0.26;
      }
      88% {
        background-position: -80% 0;
        opacity: 0.12;
      }
      100% {
        background-position: -80% 0;
        opacity: 0;
      }
    }

    @media (max-width: 620px) {
      .offer-brand {
        width: clamp(210px, 58vw, 285px);
        height: 92px;
      }

      .offer-stage {
        width: min(100% - 1.25rem, 1080px);
      }

      .offer-copy-stage {
        padding: 1rem;
      }

      .offer-message {
        font-size: clamp(1.55rem, 7.8vw, 2.4rem);
      }

      .offer-image {
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .offer-image-stage {
        display: none;
      }

      .offer-copy-stage {
        display: grid;
        min-height: min(470px, 70vh);
      }

      .offer-message {
        display: none;
        animation: none;
      }

      .offer-message:last-child {
        display: block;
        opacity: 1;
        transform: none;
      }

      .offer-brand::after {
        animation: none;
      }

      .offer-brand {
        opacity: 0.9;
        animation: none;
      }

      .offer-progress::after {
        animation-duration: 5s;
      }
    }
  </style>
</head>
<body>
  <main class="offer-intro" aria-live="polite">
    <section class="offer-stage offer-image-stage" aria-label="N3XRA free website founding offer">
      <img
        class="offer-image"
        src="/assets/N3xra-Add-Free-Website.png"
        alt="Limited Founding Offer: free website build from N3XRA"
      >
    </section>

    <section class="offer-stage offer-copy-stage" aria-label="Limited Founding Offer details">
      <div class="offer-brand">
        <img src="/assets/n3xra_logo_transparent.png" alt="N3XRA">
      </div>
      <div class="offer-message-stack">
        <div class="offer-message">
          <p class="offer-eyebrow">Limited Founding Offer</p>
          <h1>Your website build is on us.</h1>
        </div>
        <p class="offer-message">Hosting plans start at $25 a month with a one-year minimum.</p>
        <p class="offer-message">Pay for the year upfront and save 10%.</p>
        <p class="offer-message">Browse through our existing work.</p>
        <p class="offer-message offer-message-final">
          When you’re ready, choose <strong>Start a project.</strong>
        </p>
      </div>
    </section>

    <a class="offer-skip" href="/projects/?from=freewebsite">Skip to projects</a>
    <div class="offer-progress" aria-hidden="true"></div>
  </main>

  <noscript>
    <p><a href="/projects/?from=freewebsite">Continue to N3XRA projects</a></p>
  </noscript>

  <script>
    (() => {
      const destination = "/projects/?from=freewebsite";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.setTimeout(() => {
        window.location.replace(destination);
      }, reducedMotion ? 5000 : 16100);
    })();
  </script>
</body>
</html>
