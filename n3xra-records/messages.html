<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N3XRA Records Messages</title>
  <meta name="description" content="Send branded N3XRA Records messages to account users and contacts.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="canonical" href="https://n3xra.com/n3xra-records/messages" />
  <meta name="application-name" content="N3XRA Records" />
  <meta name="apple-mobile-web-app-title" content="N3XRA Records" />
  <meta name="theme-color" content="#070c12" />
  <link rel="manifest" href="/n3xra-records/site.webmanifest">
  <link rel="icon" type="image/png" href="../assets/n3xra_logo_transparent_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/n3xra-records/styles.css?v=20260801-guided-actions">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="records-messages-page">
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-row dashboard-topbar-row">
          <div class="brand">
            <a class="brand-home-link" href="/" aria-label="N3XRA home">
              <img class="brand-badge brand-badge-image" src="../assets/n3xra_logo_transparent.png" alt="n3xra.com logo">
            </a>
          </div>
          <button class="topbar-logout" id="mobile-logout-button" type="button">Logout</button>
          <button class="menu-toggle" id="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <div class="mobile-menu hidden" id="mobile-menu">
          <div class="mobile-menu-head">
            <p class="mobile-menu-title">Navigate</p>
          </div>
          <button class="mobile-menu-link" id="mobile-menu-account" type="button">Account</button>
          <button class="mobile-menu-link" id="mobile-menu-library" type="button">Library</button>
          <a class="mobile-menu-link button-link hidden" id="mobile-menu-messages-link" href="/n3xra-records/messages.html">Communication</a>
          <a class="mobile-menu-link button-link hidden" id="mobile-menu-recordings-link" href="/n3xra-records/meeting-notes/">Meeting Notes</a>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="panel stack hidden" id="setup-panel">
        <div class="panel-head">
          <div>
            <h2>Connect Supabase</h2>
            <p>Add your project URL and anon key in <code class="inline">shared/config.js</code> before using messages.</p>
          </div>
        </div>
      </section>

      <section class="panel stack hidden messages-page" id="messages-panel">
        <div class="notice hidden" id="messages-no-access-notice">
          <strong>No message access right now.</strong> Select a library you can send from before composing messages.
        </div>

        <div class="messages-workspace">
          <aside class="messages-recipient-sidebar" aria-label="Message recipients">
            <header class="messages-recipient-sidebar-head">
              <div>
                <p class="messages-section-kicker">Address book</p>
                <h3>Recipients</h3>
              </div>
              <span class="message-recipient-count-badge"><span id="message-recipient-count">0</span></span>
            </header>
            <div class="messages-recipient-sidebar-body">
              <div class="field messages-additional-recipient">
                <label for="message-send-to">Additional recipient</label>
                <input id="message-send-to" type="email" autocomplete="email" placeholder="name@example.org">
              </div>
              <div class="field hidden" id="message-send-contacts-field">
                <span class="field-title">Library recipients</span>
                <div class="document-send-contact-list" id="message-send-contact-list"></div>
              </div>
            </div>
          </aside>

          <section class="messages-editor-panel" aria-label="Message composer">
            <div class="messages-library-context" id="messages-library-context">
              <div class="field">
                <label class="sr-only" for="active-organization-select">Active library</label>
                <select id="active-organization-select" aria-label="Active library"></select>
              </div>
              <div class="messages-library-access">
                <span class="field-title">Your access</span>
                <p class="account-value" id="active-membership-role">-</p>
              </div>
            </div>

            <form class="messages-compose" id="message-form">
              <section class="messages-compose-card messages-content-card">
              <div class="field messages-subject-field">
                <label for="message-subject">Subject</label>
                <input id="message-subject" type="text" maxlength="180" required placeholder="Meeting tomorrow">
              </div>
              <div class="field messages-body-field">
                <label for="message-body">Message</label>
                <textarea id="message-body" rows="10" maxlength="5000" required placeholder="Write the announcement here..."></textarea>
              </div>
              <p class="document-send-note" id="message-from-note"></p>
              <div class="document-send-actions">
                <button class="btn secondary" id="message-reset" type="button">Clear</button>
                <button class="btn" id="message-submit" type="submit">Send message</button>
              </div>
              <p class="status" id="message-status"></p>
              </section>
            </form>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="/shared/config.js"></script>
  <script type="module" src="/n3xra-records/lib/desktop-shell.js?v=20260731-guided-actions"></script>
  <script type="module" src="/n3xra-records/messages.js?v=20260730-communication-workspace-clean"></script>
</body>
</html>
