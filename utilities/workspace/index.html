          <div class="site-nav-actions">
            <a class="site-menu-link utilities-desktop-link" id="workspace-portal-link" href="/utilities/">Customer Portal</a>
            <button class="site-menu-link utilities-admin-logout" id="workspace-logout" type="button">Logout</button>
            <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="workspace-menu" aria-label="Open menu" data-site-menu-toggle>
              <span></span>

              <span></span>

        </div>

      <p class="status-line" id="workspace-status" role="status" aria-live="polite"></p>
